<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2363c27a'/%3E%3Cstop offset='1' stop-color='%232b6e3d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12' fill='url%28%23g%29'/%3E%3Cpath d='M3 20Q24 8 45 14V2Q24-2 3 6z' fill='%23fff' opacity='.12'/%3E%3Cpath d='M35 6 18.5 30.5q-2.5 4-7.5 4.5H8' fill='none' stroke='%23fff' stroke-width='3.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M8 35h3.5' stroke='%23fff' stroke-width='5.5' stroke-linecap='round'/%3E%3Ccircle cx='31' cy='33' r='8' fill='%23fff'/%3E%3Cg fill='%232b6e3d'%3E%3Ccircle cx='31' cy='33' r='1.45'/%3E%3Ccircle cx='34.2' cy='34.85' r='1.45'/%3E%3Ccircle cx='31' cy='36.7' r='1.45'/%3E%3Ccircle cx='27.8' cy='34.85' r='1.45'/%3E%3Ccircle cx='27.8' cy='31.15' r='1.45'/%3E%3Ccircle cx='31' cy='29.3' r='1.45'/%3E%3Ccircle cx='34.2' cy='31.15' r='1.45'/%3E%3C/g%3E%3C/svg%3E">
<title>Innebandy – Anmälan</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --row: #f5f6f8;
    --text: #1b1f24;
    --muted: #6b7280;
    --border: #e3e5e9;
    --yes: #4a9d5f;
    --maybe: #e0b021;
    --no: #cc5a55;
    --none: #b5bac2;
    --track: #eceef1;
    --primary: #1b1f24;
    --on-primary: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419;
      --surface: #171d24;
      --row: #1e252d;
      --text: #e7ebef;
      --muted: #939ca7;
      --border: #28313b;
      --track: #28313b;
      --none: #5b6571;
      --primary: #e7ebef;
      --on-primary: #11161b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .logo { width: 1.5em; height: 1.5em; flex: none; border-radius: 22%; box-shadow: 0 2px 6px rgb(0 0 0 / 0.18); }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 6px; }
  .admin-link {
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
  }
  .admin-link:hover { background: var(--row); }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 1.9rem; line-height: 1.2; margin: 0; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
  }
  .date { font-size: 1.3rem; font-weight: 800; }
  .meta { color: var(--muted); margin-top: 2px; }
  .note { margin-top: 10px; font-size: 0.95rem; white-space: pre-wrap; }
  .count { margin-top: 18px; font-weight: 700; }
  .progress {
    height: 10px;
    margin-top: 10px;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .progress > div { height: 100%; width: 0; background: var(--yes); border-radius: 999px; transition: width 0.3s; }
  .verdict { margin-top: 14px; }
  .verdict span { color: var(--muted); }
  .roster { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
  .roster li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border-radius: 10px;
    background: var(--row);
    border-left: 4px solid var(--none);
  }
  .roster li.yes { border-left-color: var(--yes); }
  .roster li.maybe { border-left-color: var(--maybe); }
  .roster li.no { border-left-color: var(--no); }
  .roster li.none { color: var(--muted); }
  .roster .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .roster .tag { font-size: 0.8rem; color: var(--muted); }
  .roster li.me .name { font-weight: 700; }
  .comments { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); }
  .comments h2 { font-size: 1rem; margin: 0; }
  .comment-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 12px; }
  .comment-list .empty { color: var(--muted); font-size: 0.9rem; }
  .comment-head { display: flex; align-items: baseline; gap: 8px; }
  .comment-head strong { font-size: 0.95rem; }
  .comment-head time { font-size: 0.8rem; color: var(--muted); flex: 1; }
  .comment-body { margin-top: 2px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .comment-delete {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 0.8rem;
    cursor: pointer;
    padding: 2px 4px;
  }
  .comment-delete:hover { color: var(--no); }
  .comment-form { margin-top: 14px; display: grid; gap: 8px; }
  .comment-form textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    resize: vertical;
  }
  .comment-form button {
    justify-self: start;
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: var(--on-primary);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .comment-form button:disabled { opacity: 0.6; cursor: wait; }
  .ask { margin-top: 22px; font-weight: 600; }
  .answers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .answers button {
    padding: 12px 4px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .answers button:disabled { opacity: 0.6; cursor: wait; }
  .answers button.active { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .status { margin-top: 10px; min-height: 1.3em; font-size: 0.9rem; color: var(--muted); }
  .status.err { color: var(--no); }
  .hint {
    margin-top: 20px;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--row);
    color: var(--muted);
    font-size: 0.9rem;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main>
    <header class="head">
      <h1><svg class="logo" aria-hidden="true" viewBox="0 0 48 48"><defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63c27a"/><stop offset="1" stop-color="#2b6e3d"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#logo-g)"/><path d="M3 20Q24 8 45 14V2Q24-2 3 6z" fill="#fff" opacity=".12"/><path d="M35 6 18.5 30.5q-2.5 4-7.5 4.5H8" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 35h3.5" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/><circle cx="31" cy="33" r="8" fill="#fff"/><g fill="#2b6e3d"><circle cx="31" cy="33" r="1.45"/><circle cx="34.2" cy="34.85" r="1.45"/><circle cx="31" cy="36.7" r="1.45"/><circle cx="27.8" cy="34.85" r="1.45"/><circle cx="27.8" cy="31.15" r="1.45"/><circle cx="31" cy="29.3" r="1.45"/><circle cx="34.2" cy="31.15" r="1.45"/></g></svg>Innebandy</h1>
      <a class="admin-link" href="/admin">Admin</a>
    </header>
    <p class="lead">Anmäl dig enkelt.</p>

    <section class="card">
      <div class="meta" id="loading">Laddar…</div>
      <div id="noEvent" hidden>
        <div class="date">Inget pass inlagt</div>
        <div class="meta">Nästa pass dyker upp här när det är bokat.</div>
      </div>

      <div id="eventBox" hidden>
        <div class="date" id="date"></div>
        <div class="meta" id="meta"></div>
        <div class="note" id="note" hidden></div>

        <div class="count" id="count"></div>
        <div class="progress"><div id="bar"></div></div>
        <div class="verdict" id="verdict"></div>

        <ul class="roster" id="roster"></ul>

        <div id="answerBox" hidden>
          <div class="ask">Kommer du, <span id="myName"></span>?</div>
          <div class="answers">
            <button data-status="yes">🟢 Kommer</button>
            <button data-status="maybe">🟡 Kanske</button>
            <button data-status="no">🔴 Kan inte</button>
          </div>
          <div class="status" id="status"></div>
        </div>

        <div class="hint" id="noTokenHint" hidden>
          Öppna din <strong>personliga länk</strong> för att svara. Har du ingen? Fråga den som administrerar gruppen.
        </div>

        <div class="comments">
          <h2>Kommentarer</h2>
          <ul class="comment-list" id="comments"></ul>
          <form class="comment-form" id="commentForm" hidden>
            <textarea id="commentText" rows="2" maxlength="500" placeholder="Skriv en kommentar, t.ex. &quot;Jag tar med bollar&quot;"></textarea>
            <button type="submit">Skicka</button>
          </form>
          <div class="status" id="commentStatus"></div>
        </div>
      </div>
    </section>
  </main>

<script>
  const TOKEN_KEY = "innebandy-token";
  const ADMIN_KEY = "innebandy-admin";
  const ICON = { yes: "🟢", maybe: "🟡", no: "🔴", none: "⚪" };
  const ORDER = { yes: 0, maybe: 1, no: 2, none: 3 };

  const $ = (id) => document.getElementById(id);
  const answerButtons = document.querySelectorAll(".answers button");
  let current = null;

  // Personlig länk: /?p=<token>. Spara token och städa bort den ur adressfältet.
  function loadToken() {
    const params = new URLSearchParams(location.search);
    const fromUrl = params.get("p");
    if (fromUrl) {
      try { localStorage.setItem(TOKEN_KEY, fromUrl); } catch {}
      params.delete("p");
      const rest = params.toString();
      history.replaceState(null, "", location.pathname + (rest ? "?" + rest : ""));
      return fromUrl;
    }
    try { return localStorage.getItem(TOKEN_KEY); } catch { return null; }
  }
  const token = loadToken();

  // Är man inloggad som admin i samma webbläsare kan man ta bort alla kommentarer.
  let adminToken = null;
  try { adminToken = localStorage.getItem(ADMIN_KEY); } catch {}

  function headers() {
    const h = { "Content-Type": "application/json" };
    if (token) h["X-Player-Token"] = token;
    if (adminToken) h["Authorization"] = "Bearer " + adminToken;
    return h;
  }

  function timeAgo(iso) {
    const minutes = Math.round((Date.now() - new Date(iso)) / 60000);
    if (minutes < 1) return "nyss";
    if (minutes < 60) return `${minutes} min sedan`;
    const hours = Math.round(minutes / 60);
    if (hours < 24) return `${hours} tim sedan`;
    return stockholm(iso, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  }

  function renderComments(list) {
    const ul = $("comments");
    ul.innerHTML = "";
    if (!list.length) {
      ul.append(Object.assign(document.createElement("li"), { className: "empty", textContent: "Inga kommentarer än." }));
    }
    for (const c of list) {
      const li = document.createElement("li");
      const head = document.createElement("div");
      head.className = "comment-head";
      const time = document.createElement("time");
      time.dateTime = c.created_at;
      time.textContent = timeAgo(c.created_at);
      head.append(Object.assign(document.createElement("strong"), { textContent: c.name }), time);
      if (c.can_delete) {
        const del = Object.assign(document.createElement("button"), { className: "comment-delete", textContent: "Ta bort" });
        del.addEventListener("click", () => deleteComment(c.id));
        head.append(del);
      }
      li.append(head, Object.assign(document.createElement("div"), { className: "comment-body", textContent: c.body }));
      ul.append(li);
    }
  }

  function stockholm(iso, options) {
    return new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Stockholm", ...options }).format(new Date(iso));
  }

  function render(data) {
    current = data;
    $("loading").hidden = true;
    $("noEvent").hidden = !!data.event;
    $("eventBox").hidden = !data.event;
    if (!data.event) return;

    const e = data.event;
    $("date").textContent = stockholm(e.starts_at, { weekday: "long", day: "numeric", month: "long" });
    const time = stockholm(e.starts_at, { hour: "2-digit", minute: "2-digit" });
    $("meta").textContent = e.location ? `${time} · ${e.location}` : time;
    $("note").hidden = !e.note;
    $("note").textContent = e.note || "";

    const yes = data.players.filter((p) => p.status === "yes").length;
    $("count").textContent = `${yes} kommer`;
    $("bar").style.width = Math.min(100, (yes / e.min_players) * 100) + "%";

    const verdict = $("verdict");
    verdict.innerHTML = "";
    const strong = document.createElement("strong");
    const extra = document.createElement("span");
    extra.textContent = ` (minst ${e.min_players})`;
    if (yes >= e.min_players) {
      strong.textContent = "Blir av!";
      verdict.append("🟢 ", strong, extra);
    } else {
      strong.textContent = `Behöver ${e.min_players - yes} till`;
      verdict.append("🟡 ", strong, extra);
    }

    const roster = $("roster");
    roster.innerHTML = "";
    const sorted = [...data.players].sort(
      (a, b) => ORDER[a.status || "none"] - ORDER[b.status || "none"]
    );
    for (const p of sorted) {
      const status = p.status || "none";
      const li = document.createElement("li");
      li.className = status;
      const icon = document.createElement("span");
      icon.textContent = ICON[status];
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = p.name;
      li.append(icon, name);
      if (status === "none") {
        li.append(Object.assign(document.createElement("span"), { className: "tag", textContent: "inte svarat" }));
      }
      if (data.me && p.name === data.me.name) {
        li.classList.add("me");
        li.append(Object.assign(document.createElement("span"), { className: "tag", textContent: "du" }));
      }
      roster.appendChild(li);
    }

    renderComments(data.comments || []);
    $("commentForm").hidden = !data.me;

    $("answerBox").hidden = !data.me;
    $("noTokenHint").hidden = !!data.me;
    if (data.me) {
      $("myName").textContent = data.me.name;
      answerButtons.forEach((b) => b.classList.toggle("active", b.dataset.status === data.me.status));
    }
  }

  async function refresh() {
    try {
      const res = await fetch("/api/event", { headers: headers() });
      render(await res.json());
    } catch {
      $("loading").hidden = false;
      $("loading").textContent = "Kunde inte hämta passet. Försöker igen…";
    }
  }

  async function answer(status) {
    if (!current || !current.event) return;
    const statusEl = $("status");
    answerButtons.forEach((b) => (b.disabled = true));
    statusEl.textContent = "Sparar…";
    statusEl.className = "status";
    try {
      const res = await fetch("/api/response", {
        method: "PUT",
        headers: headers(),
        body: JSON.stringify({ event_id: current.event.id, status })
      });
      const data = await res.json();
      if (data.ok) {
        statusEl.textContent = { yes: "Kul, vi ses! 🎉", maybe: "Noterat – svara gärna ja eller nej när du vet.", no: "Tråkigt, vi ses nästa gång!" }[status];
        await refresh();
      } else {
        statusEl.textContent = data.error || "Något gick fel.";
        statusEl.className = "status err";
      }
    } catch {
      statusEl.textContent = "Kunde inte nå servern.";
      statusEl.className = "status err";
    }
    answerButtons.forEach((b) => (b.disabled = false));
  }

  async function postComment(event) {
    event.preventDefault();
    const text = $("commentText").value.trim();
    if (!text || !current || !current.event) return;
    const btn = $("commentForm").querySelector("button");
    btn.disabled = true;
    $("commentStatus").textContent = "";
    try {
      const res = await fetch("/api/comments", {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({ event_id: current.event.id, body: text })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "Något gick fel.");
      $("commentText").value = "";
      await refresh();
    } catch (e) {
      $("commentStatus").textContent = e.message === "Failed to fetch" ? "Kunde inte nå servern." : e.message;
      $("commentStatus").className = "status err";
    }
    btn.disabled = false;
  }

  async function deleteComment(id) {
    if (!confirm("Ta bort kommentaren?")) return;
    await fetch(`/api/comments/${id}`, { method: "DELETE", headers: headers() });
    await refresh();
  }

  $("commentForm").addEventListener("submit", postComment);
  answerButtons.forEach((b) => b.addEventListener("click", () => answer(b.dataset.status)));
  refresh();
  // Uppdatera listan var 15:e sekund medan sidan är synlig.
  setInterval(() => { if (!document.hidden) refresh(); }, 15000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
