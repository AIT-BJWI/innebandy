<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innebandy – Anmälan</title>
<style>
  :root {
    --bg: #0f1720;
    --card: #16212c;
    --accent: #4ade80;
    --accent-dim: #22c55e33;
    --text: #e6edf3;
    --muted: #8b98a5;
    --danger: #f87171;
    --border: #24313d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100vh;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    max-width: 420px;
    width: 100%;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin: 16px 0 6px;
  }
  select, input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0d1620;
    color: var(--text);
    font-size: 1rem;
  }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #06240f;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    font-size: 0.9rem;
    min-height: 20px;
  }
  .ok { color: var(--accent); }
  .err { color: var(--danger); }
  .list {
    margin-top: 24px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .count {
    font-size: 1.6rem;
    font-weight: 700;
  }
  .count span { font-size: 1rem; color: var(--muted); font-weight: 400; }
  ul { list-style: none; padding: 0; margin: 10px 0 0; }
  li {
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
  }
  li:last-child { border-bottom: none; }
  .badge {
    display: inline-block;
    margin-top: 10px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    background: var(--accent-dim);
    color: var(--accent);
  }
  .badge.low { background: #f8717133; color: var(--danger); }
</style>
</head>
<body>
  <div class="card">
    <h1>🏒 Innebandy – nästa pass</h1>
    <div class="sub">Anmäl dig så ser alla direkt hur många vi blir.</div>

    <label for="name">Namn</label>
    <select id="name">
      <option value="">Välj ditt namn…</option>
    </select>
    <input id="customName" type="text" placeholder="…eller skriv nytt namn" style="margin-top:8px;">

    <button id="submitBtn">Anmäl mig</button>
    <div class="status" id="status"></div>

    <div class="list">
      <div class="count" id="count">– <span>anmälda</span></div>
      <div class="badge" id="badge"></div>
      <ul id="players"></ul>
      <button id="unregisterBtn" style="display:none; margin-top:16px; background:#24313d; color:var(--text);">Anmäl av mig</button>
    </div>
  </div>

<script>
  // Justera listan till era 8 spelare, eller lämna tom och låt alla skriva eget namn.
  const KNOWN_PLAYERS = ["Anna", "Björn", "Erik", "Johan", "Karin", "Lisa", "Marcus", "Sara"];
  const MIN_PLAYERS = 6; // hur många som behövs för att det ska bli av

  const nameSelect = document.getElementById("name");
  const customName = document.getElementById("customName");
  const statusEl = document.getElementById("status");
  const countEl = document.getElementById("count");
  const badgeEl = document.getElementById("badge");
  const playersEl = document.getElementById("players");
  const submitBtn = document.getElementById("submitBtn");
  const unregisterBtn = document.getElementById("unregisterBtn");

  KNOWN_PLAYERS.forEach(n => {
    const opt = document.createElement("option");
    opt.value = n;
    opt.textContent = n;
    nameSelect.appendChild(opt);
  });

  function currentName() {
    return customName.value.trim() || nameSelect.value;
  }

  async function refreshList() {
    try {
      const res = await fetch("/api/list");
      const data = await res.json();
      playersEl.innerHTML = "";
      data.players.forEach(p => {
        const li = document.createElement("li");
        li.textContent = p;
        playersEl.appendChild(li);
      });
      countEl.innerHTML = `${data.players.length} <span>av ${MIN_PLAYERS}+ som behövs</span>`;
      if (data.players.length >= MIN_PLAYERS) {
        badgeEl.textContent = "Blir av! ✅";
        badgeEl.classList.remove("low");
      } else {
        badgeEl.textContent = `${MIN_PLAYERS - data.players.length} till behövs`;
        badgeEl.classList.add("low");
      }
      const me = currentName();
      unregisterBtn.style.display = me && data.players.includes(me) ? "block" : "none";
    } catch (e) {
      countEl.textContent = "Kunde inte hämta listan";
    }
  }

  async function signup() {
    const name = currentName();
    if (!name) {
      statusEl.textContent = "Välj eller skriv ett namn först.";
      statusEl.className = "status err";
      return;
    }
    submitBtn.disabled = true;
    statusEl.textContent = "Skickar…";
    statusEl.className = "status";
    try {
      const res = await fetch("/api/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });
      const data = await res.json();
      if (data.ok) {
        statusEl.textContent = "Du är anmäld! 🎉";
        statusEl.className = "status ok";
        await refreshList();
      } else {
        statusEl.textContent = data.error || "Något gick fel.";
        statusEl.className = "status err";
      }
    } catch (e) {
      statusEl.textContent = "Kunde inte nå servern.";
      statusEl.className = "status err";
    }
    submitBtn.disabled = false;
  }

  async function unregister() {
    const name = currentName();
    if (!name) return;
    await fetch("/api/signup", {
      method: "DELETE",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name })
    });
    statusEl.textContent = "Du är avanmäld.";
    statusEl.className = "status";
    await refreshList();
  }

  submitBtn.addEventListener("click", signup);
  unregisterBtn.addEventListener("click", unregister);
  refreshList();
  setInterval(refreshList, 15000); // auto-uppdatera listan var 15:e sekund
</script>
</body>
</html>
