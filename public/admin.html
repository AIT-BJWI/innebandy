<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Innebandy – Admin</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --row: #f5f6f8;
    --text: #1b1f24;
    --muted: #6b7280;
    --border: #e3e5e9;
    --ok: #3f8a53;
    --danger: #cc5a55;
    --primary: #1b1f24;
    --on-primary: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419;
      --surface: #171d24;
      --row: #1e252d;
      --text: #e7ebef;
      --muted: #939ca7;
      --border: #28313b;
      --ok: #5fb877;
      --primary: #e7ebef;
      --on-primary: #11161b;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand { font-size: 1.25rem; font-weight: 800; color: var(--text); text-decoration: none; }
  .topbar-actions { display: flex; gap: 8px; }
  .nav-link {
    padding: 8px 14px;
    border-radius: 10px;
    background: var(--row);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.2;
    border: 1px solid var(--row);
    text-decoration: none;
  }
  .topbar button { padding: 8px 14px; font-size: 0.9rem; line-height: 1.2; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 16px; }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0; }
  .lead { color: var(--muted); margin: -8px 0 4px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
  }
  h2 { font-size: 1.15rem; margin: 0 0 4px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
  input, textarea, select {
    width: 100%;
    min-width: 0;
    display: block;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  /* iOS Safari ger datumfält en egen minsta bredd och höjd; tvinga dem att följa layouten. */
  input[type="datetime-local"], input[type="time"] {
    -webkit-appearance: none;
    appearance: none;
    min-height: 44px;
    text-align: left;
  }
  input::-webkit-date-and-time-value { text-align: left; }
  input::-webkit-calendar-picker-indicator { cursor: pointer; }
  button {
    padding: 10px 16px;
    border: 1px solid var(--primary);
    border-radius: 10px;
    background: var(--primary);
    color: var(--on-primary);
    font-weight: 600;
    font-size: 0.95rem;
    font-family: inherit;
    cursor: pointer;
  }
  button.secondary { background: var(--row); border-color: var(--row); color: var(--text); }
  button.danger { background: transparent; border-color: transparent; color: var(--danger); padding: 6px 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row input { flex: 1; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 0 12px; }
  @media (max-width: 480px) {
    .grid2 { grid-template-columns: minmax(0, 1fr); }
  }
  .actions { margin-top: 14px; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 8px; }
  li {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--row);
  }
  li.empty { color: var(--muted); }
  li .grow { flex: 1; min-width: 8em; }
  li .meta { font-size: 0.8rem; color: var(--muted); }
  li button { padding: 6px 10px; font-size: 0.85rem; }
  li button.secondary { background: var(--surface); border-color: var(--border); }
  .msg { margin-top: 10px; font-size: 0.9rem; min-height: 1.2em; }
  .err { color: var(--danger); }
  .ok { color: var(--ok); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🏒 Innebandy</a>
    <div class="topbar-actions">
      <a class="nav-link" href="/">Anmälan</a>
      <button class="secondary" id="logoutBtn" hidden>Logga ut</button>
    </div>
  </header>

  <main>
  <h1>Admin</h1>
  <p class="lead">Lägg in pass och spelare och skicka ut personliga länkar.</p>

  <div class="card" id="loginCard">
    <h2>Logga in</h2>
    <form id="login">
      <label for="adminToken">Admin-lösenord</label>
      <div class="row">
        <input id="adminToken" type="password" autocomplete="current-password">
        <button type="submit">Logga in</button>
      </div>
      <div class="msg" id="loginMsg"></div>
    </form>
  </div>

  <div class="card" id="eventsCard" hidden>
    <h2>Pass</h2>
    <div class="grid2">
      <div>
        <label for="startsAt">Datum och tid</label>
        <input id="startsAt" type="datetime-local">
      </div>
      <div>
        <label for="minPlayers">Minst antal spelare</label>
        <input id="minPlayers" type="number" min="1" max="100" value="6">
      </div>
    </div>
    <label for="location">Plats</label>
    <input id="location" type="text" maxlength="80" placeholder="t.ex. Västerhallen">
    <label for="note">Info (valfritt)</label>
    <textarea id="note" rows="2" maxlength="300" placeholder="t.ex. Ta med både mörk och ljus tröja"></textarea>
    <div class="actions"><button id="addEventBtn">Lägg till pass</button></div>
    <div class="msg" id="eventMsg"></div>
    <ul id="events"></ul>
  </div>

  <div class="card" id="playersCard" hidden>
    <h2>Spelare</h2>
    <div class="row">
      <input id="playerName" type="text" maxlength="40" placeholder="Namn">
      <button id="addPlayerBtn">Lägg till</button>
    </div>
    <div class="msg" id="playerMsg"></div>
    <ul id="players"></ul>
  </div>
  </main>

<script>
  const ADMIN_KEY = "innebandy-admin";
  const $ = (id) => document.getElementById(id);
  let adminToken = "";
  try { adminToken = localStorage.getItem(ADMIN_KEY) || ""; } catch {}

  async function api(path, method = "GET", body) {
    const res = await fetch(path, {
      method,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + adminToken },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { logout("Fel lösenord."); throw new Error("unauthorized"); }
    if (!res.ok) throw new Error(data.error || "Något gick fel.");
    return data;
  }

  function show(el, text, ok) {
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "err");
  }

  function personalLink(token) {
    return `${location.origin}/?p=${encodeURIComponent(token)}`;
  }

  function formatStart(iso) {
    return new Intl.DateTimeFormat("sv-SE", {
      timeZone: "Europe/Stockholm",
      weekday: "short", day: "numeric", month: "short",
      hour: "2-digit", minute: "2-digit"
    }).format(new Date(iso));
  }

  function button(text, cls, onClick) {
    const b = document.createElement("button");
    b.textContent = text;
    if (cls) b.className = cls;
    b.addEventListener("click", onClick);
    return b;
  }

  function textBlock(title, meta) {
    const div = document.createElement("div");
    div.className = "grow";
    const t = document.createElement("div");
    t.textContent = title;
    const m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;
    div.append(t, m);
    return div;
  }

  async function loadPlayers() {
    const { players } = await api("/api/admin/players");
    const ul = $("players");
    ul.innerHTML = "";
    if (!players.length) {
      ul.innerHTML = '<li class="empty">Inga spelare än.</li>';
      return;
    }
    for (const p of players) {
      const li = document.createElement("li");
      li.append(
        textBlock(p.name, ""),
        button("Kopiera länk", "secondary", async () => {
          try {
            await navigator.clipboard.writeText(personalLink(p.token));
            show($("playerMsg"), `Länken till ${p.name} är kopierad.`, true);
          } catch {
            prompt(`Personlig länk för ${p.name}:`, personalLink(p.token));
          }
        }),
        button("Ny länk", "secondary", async () => {
          if (!confirm(`Skapa en ny länk för ${p.name}? Den gamla slutar fungera.`)) return;
          await api(`/api/admin/players/${p.id}`, "POST");
          show($("playerMsg"), `Ny länk skapad för ${p.name}.`, true);
          loadPlayers();
        }),
        button("✕", "danger", async () => {
          if (!confirm(`Ta bort ${p.name}? Hens svar raderas också.`)) return;
          await api(`/api/admin/players/${p.id}`, "DELETE");
          loadPlayers();
        })
      );
      ul.appendChild(li);
    }
  }

  async function loadEvents() {
    const { events } = await api("/api/admin/events");
    const ul = $("events");
    ul.innerHTML = "";
    if (!events.length) {
      ul.innerHTML = '<li class="empty">Inga kommande pass.</li>';
      return;
    }
    for (const e of events) {
      const li = document.createElement("li");
      const meta = [e.location, `${e.yes}/${e.min_players} ja`].filter(Boolean).join(" · ");
      li.append(
        textBlock(formatStart(e.starts_at), meta),
        button("✕", "danger", async () => {
          if (!confirm("Ta bort passet och alla svar?")) return;
          await api(`/api/admin/events/${e.id}`, "DELETE");
          loadEvents();
        })
      );
      ul.appendChild(li);
    }
  }

  async function login() {
    try {
      await Promise.all([loadPlayers(), loadEvents()]);
    } catch (e) {
      if (e.message !== "unauthorized") show($("loginMsg"), e.message);
      return;
    }
    try { localStorage.setItem(ADMIN_KEY, adminToken); } catch {}
    $("loginCard").hidden = true;
    $("logoutBtn").hidden = false;
    $("eventsCard").hidden = false;
    $("playersCard").hidden = false;
  }

  function logout(message) {
    adminToken = "";
    try { localStorage.removeItem(ADMIN_KEY); } catch {}
    $("loginCard").hidden = false;
    $("logoutBtn").hidden = true;
    $("eventsCard").hidden = true;
    $("playersCard").hidden = true;
    if (message) show($("loginMsg"), message);
  }

  $("login").addEventListener("submit", (e) => {
    e.preventDefault();
    adminToken = $("adminToken").value.trim();
    if (adminToken) login();
  });
  // Utloggning tar en tillbaka till anmälningssidan.
  $("logoutBtn").addEventListener("click", () => {
    logout();
    location.href = "/";
  });

  $("addPlayerBtn").addEventListener("click", async () => {
    const name = $("playerName").value.trim();
    if (!name) return;
    try {
      const { player } = await api("/api/admin/players", "POST", { name });
      $("playerName").value = "";
      show($("playerMsg"), `${player.name} är tillagd. Kopiera hens länk och skicka den.`, true);
      loadPlayers();
    } catch (e) {
      show($("playerMsg"), e.message);
    }
  });
  $("playerName").addEventListener("keydown", (e) => { if (e.key === "Enter") $("addPlayerBtn").click(); });

  $("addEventBtn").addEventListener("click", async () => {
    const value = $("startsAt").value;
    if (!value) return show($("eventMsg"), "Välj datum och tid.");
    try {
      await api("/api/admin/events", "POST", {
        // datetime-local tolkas i webbläsarens tidszon och skickas som UTC.
        starts_at: new Date(value).toISOString(),
        location: $("location").value,
        note: $("note").value,
        min_players: Number($("minPlayers").value)
      });
      show($("eventMsg"), "Passet är tillagt.", true);
      $("note").value = "";
      loadEvents();
    } catch (e) {
      show($("eventMsg"), e.message);
    }
  });

  if (adminToken) login();
</script>
</body>
</html>
